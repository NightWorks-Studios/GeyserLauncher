plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def jreParts = fileTree('jre25') { include 'jre25.zip.part*' }
def generatedJreAssets = layout.buildDirectory.dir('generated/jre-assets')
def assembleBundledJre = tasks.register('assembleBundledJre') {
    inputs.files(jreParts)
    outputs.file(generatedJreAssets.map { it.file('jre25.zip') })
    doLast {
        def outputFile = generatedJreAssets.get().file('jre25.zip').asFile
        outputFile.parentFile.mkdirs()
        outputFile.withOutputStream { output ->
            jreParts.files.sort { left, right -> left.name <=> right.name }.each { part ->
                part.withInputStream { input -> input.transferTo(output) }
            }
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        outputFile.withInputStream { input ->
            def buffer = new byte[65536]
            for (int count = input.read(buffer); count >= 0; count = input.read(buffer)) {
                if (count > 0) digest.update(buffer, 0, count)
            }
        }
        def actualHash = digest.digest().encodeHex().toString()
        def expectedHash = 'b54257977ed6540faa704a3a147f7943d5f1734314b722665fe2d8ab2c449321'
        if (actualHash != expectedHash) {
            outputFile.delete()
            throw new GradleException("Bundled JRE checksum mismatch: $actualHash")
        }
    }
}

android {
    namespace 'dev.lisfox.geyserlauncher'
    compileSdk 34
    defaultConfig {
        applicationId 'dev.lisfox.geyserlauncher'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    androidResources { noCompress += ['zip', 'jar'] }
    sourceSets { main.assets.srcDir(generatedJreAssets) }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    lint {
        disable 'ExpiredTargetSdkVersion'
    }
}

tasks.named('preBuild').configure { dependsOn assembleBundledJre }

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.navigation:navigation-compose:2.8.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'
    implementation 'org.yaml:snakeyaml:2.2'
    testImplementation 'junit:junit:4.13.2'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
